allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationContext.addDependencyCategory(
        DependencyCategory(
            name: DependencyCategory.GRADLE_PLUGIN
        )
    )
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
